# Native dev/prod flavors (already applied to android/ and ios/). To re-apply after changing ids:
#   dart run flutter_flavorizr -p android:buildGradle,android:androidManifest,ios:xcconfig,ios:buildTargets,ios:schema,ios:plist
# (iOS processors need Ruby with the xcodeproj gem.)
#   dev  → store.cms4cas.app.dev  → Firebase project CMS4Cas-Dev
#   prod → store.cms4cas.app      → Firebase project CMS4Cas
# The flutter:* processors are deliberately not used — they would overwrite lib/main.dart and app.dart.
# Firebase options are Dart-side (lib/firebase_options_<flavor>.dart, from app/tool/firebase_setup.sh).
# Service files are per flavor: android/app/src/<flavor>/google-services.json and
# ios/config/<flavor>/GoogleService-Info.plist (bound to that flavor's build configurations only),
# so a dev build can never talk to production.
flavors:
  dev:
    app:
      name: "CMS Dev"
    android:
      applicationId: "store.cms4cas.app.dev"
    ios:
      bundleId: "store.cms4cas.app.dev"
  prod:
    app:
      name: "CMS"
    android:
      applicationId: "store.cms4cas.app"
    ios:
      bundleId: "store.cms4cas.app"
